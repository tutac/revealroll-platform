apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube-secrets
  namespace: argocd
  annotations:
    # Wave -2, like monitoring-secrets: PostgreSQL and SonarQube both read this Secret at
    # startup. Arriving second means a CreateContainerConfigError until the next sync.
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://github.com/tutac/revealroll-platform.git
    targetRevision: main
    path: secrets/sonarqube

  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
