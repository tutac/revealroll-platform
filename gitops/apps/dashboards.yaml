apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboards
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  # Its own Application because the source is kustomize, not a plain directory -- Argo
  # detects the kustomization.yaml at this path. The sibling `observability` Application
  # excludes dashboards/* for exactly this reason.
  source:
    repoURL: https://github.com/tutac/revealroll-platform.git
    targetRevision: main
    path: observability/dashboards

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

  revisionHistoryLimit: 10
