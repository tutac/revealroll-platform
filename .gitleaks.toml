# Picked up automatically by `gitleaks detect` when run from the repo root.
title = "RevealRoll platform"

[extend]
# Keep every default rule. This file only ADDS an allowlist; it never relaxes detection.
useDefault = true

[allowlist]
description = """
Files that hold real credentials by design, are gitignored, and are never committed.

`gitleaks detect --no-git` scans the working directory and does NOT consult .gitignore, so
without this it reports .envrc on every single run -- two findings that are correct about the
content and wrong about the risk. A lint step that always fails is a lint step you stop reading,
which is how the one real finding eventually gets scrolled past.

This is safe ONLY because .gitignore already blocks these paths (see the Secrets block there) and
`gitleaks detect` over git history -- which is the check that actually matters, and which this
allowlist deliberately does not weaken -- is clean. Verified 2026-08-12: 5 commits, 0 findings.

Do NOT widen this list to silence a finding in a file that git tracks. If a tracked file trips a
rule, the answer is to rotate the credential and remove it, not to add a path here.
"""

paths = [
  '''^\.envrc$''',
  '''^\.env(\..+)?$''',

  # SealedSecrets. This one is different from the two above and the difference matters:
  # these files ARE tracked by git, which the warning above says never to allowlist.
  #
  # The exception is legitimate because the content is ciphertext BY DESIGN. spec.encryptedData
  # is RSA-encrypted against the cluster controller's public key; it is base64, so it looks
  # exactly like an API key to a regex, and it is safe in a public repository precisely because
  # only the in-cluster private key can read it. That is the entire point of Stage 05.
  #
  # What stops a genuine plaintext Secret being committed to this path is NOT this allowlist —
  # it is scripts/seal-env.sh, which greps its own output for sk_test_/sk_live_/JWT shapes and
  # refuses to write the file if it finds any. If you ever hand-write a file here instead of
  # generating it, you have stepped outside that guard: read it before committing.
  '''^secrets/.*-sealed\.yaml$''',
]
