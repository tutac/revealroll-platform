[defaults]
inventory           = inventory/staging.yml
roles_path          = roles
# The old `stdout_callback = yaml` was community.general's, removed in that collection's
# v12. ansible-core does the same thing natively via result_format.
stdout_callback     = default
result_format       = yaml
retry_files_enabled = False
interpreter_python  = auto_silent
host_key_checking   = True
# Facts are gathered by most plays; caching keeps repeat runs from re-probing the host.
gathering           = smart

[ssh_connection]
# Pipelining removes one SSH round-trip per task. Requires `requiretty` to be off in
# sudoers, which it is on Ubuntu. ControlPersist reuses one TCP connection for the whole
# play -- on a 130ms-RTT link to Germany that is the difference between 40s and 4s.
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
