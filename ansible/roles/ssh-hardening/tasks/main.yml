---
- name: Read the passwd database
  ansible.builtin.getent:
    database: passwd
  become: true

- name: Assert the deploy user exists before locking SSH down to it
  ansible.builtin.assert:
    that: ssh_hardening_user in ansible_facts.getent_passwd
    fail_msg: >-
      {{ ssh_hardening_user }} does not exist -- AllowUsers {{ ssh_hardening_user }}
      would lock every account out of this host. Run playbooks/00-bootstrap.yml first.
    success_msg: "{{ ssh_hardening_user }} exists; safe to restrict AllowUsers to it."

- name: Check whether SSH is socket-activated (Ubuntu 22.10+)
  # noqa: command-instead-of-module
  # This reads state rather than setting it, and the systemd module has no query mode.
  # service_facts does not reliably enumerate .socket units, so the command is correct.
  ansible.builtin.command: systemctl is-enabled ssh.socket
  register: ssh_hardening_socket_state
  changed_when: false
  failed_when: false
  become: true

- name: Record how this host serves SSH
  # Set before anything can notify a handler: the handlers branch on it, and a handler
  # that runs with this undefined would fail at the end of the play, after the config has
  # already changed -- the worst possible moment.
  ansible.builtin.set_fact:
    ssh_hardening_socket_activated: "{{ ssh_hardening_socket_state.stdout == 'enabled' }}"

- name: Deploy the hardened sshd drop-in
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: "{{ ssh_hardening_dropin }}"
    owner: root
    group: root
    mode: "0644"
    # sshd refuses to start on a config it cannot parse. Validating here means a broken
    # template is caught before the file lands, not after the restart takes SSH away.
    validate: /usr/sbin/sshd -t -f %s
  become: true
  notify: Restart ssh

- name: Remove cloud-image drop-ins that contradict the hardened config
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ ssh_hardening_conflicting_dropins }}"
  become: true
  notify: Restart ssh

- name: Ensure the ssh.socket drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when:
    - ssh_hardening_socket_activated
    - ssh_hardening_port | int != 22

- name: Align the socket unit with the configured port
  # Only when the port actually differs from the systemd vendor default. Writing an
  # override that sets 22 to 22 changes nothing, and every file you deploy for no reason
  # is a file that can fail for no reason.
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.socket.d/override.conf
    content: |
      # MANAGED BY ANSIBLE -- roles/ssh-hardening
      [Socket]
      ListenStream=
      ListenStream={{ ssh_hardening_port }}
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - ssh_hardening_socket_activated
    - ssh_hardening_port | int != 22
  notify: Restart ssh

- name: Remove the socket port override when SSH is on the default port
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d/override.conf
    state: absent
  become: true
  when: ssh_hardening_port | int == 22
  notify: Restart ssh
