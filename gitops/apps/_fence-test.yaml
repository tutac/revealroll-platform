# TEMPORARY — delete this file once you have watched it fail.
#
# The `apps` AppProject allows exactly one destination namespace: revealroll. This
# Application asks for kube-system. Argo must REFUSE it:
#
#   ComparisonError: application destination namespace 'kube-system' is not permitted
#   in project 'apps'
#
# A deliberately harmless copy rather than a repoint of the real revealroll app: if the
# fence did not hold, repointing the live Application would prune the running workload
# out of revealroll. The expected result is a refusal, so nothing should ever be created
# in kube-system — but the test must be safe in the case where the assumption is wrong.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fence-test
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/tutac/revealroll-platform.git
    targetRevision: main
    path: charts/revealroll
    helm:
      valueFiles: [values-staging.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # No automated sync. Even in the refused case, nothing should try to apply itself.
