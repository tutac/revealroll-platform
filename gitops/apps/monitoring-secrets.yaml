apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-secrets
  namespace: argocd
  annotations:
    # Before the stack itself: Grafana reads grafana-admin at startup. Arriving second
    # means a CreateContainerConfigError until the next sync.
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # platform, not apps: the destination is the monitoring namespace, which the apps
  # project is deliberately not allowed to touch.
  project: platform

  source:
    repoURL: https://github.com/tutac/revealroll-platform.git
    targetRevision: main
    path: secrets/monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
