---
# Facts every role shares. Role-specific knobs live in each role's defaults/main.yml;
# this file is only for values more than one role needs, or that you will actually tune.

# The unprivileged account every play after 00-bootstrap connects as.
deploy_user: deploy

# Read off your workstation at run time, so the key is never copied into the repo.
deploy_user_pubkey: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"

# SSH stays on 22 for this build. If you ever move it, change it here, run the firewall
# role FIRST so the new port is open, and only then update ansible_port in the inventory.
ssh_port: 22

# Ingress terminates 80/443 on the host via hostPort -- there is no cloud load balancer.
public_tcp_ports:
  - 80
  - 443

timezone: UTC

# Every staging hostname hangs off this. The apex revealroll.com is Vercel production and
# is never served from this cluster.
base_domain: stg.revealroll.com

# SANs are baked into the kube-apiserver serving certificate at INSTALL time and cannot be
# added later without regenerating certs. Listing the public IP and the hostnames now costs
# nothing and keeps "allow 6443 from my home IP" a firewall change rather than a k3s
# reinstall. 127.0.0.1 is always included by k3s itself, which is what makes the SSH tunnel
# in scripts/fetch-kubeconfig.sh work without any SAN of ours.
#
# This lives here, not in roles/k3s-server/defaults, because ansible_host is inventory data:
# a role that hardcodes one server's IP is not a role.
k3s_tls_sans:
  - "{{ ansible_host }}"
  - "{{ base_domain }}"
  - "argocd.{{ base_domain }}"
