apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: revealroll-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps

  # Secrets are their own Application rather than files inside charts/revealroll/.
  # Two reasons: a change to a credential shows up as a diff on its own Application
  # instead of hiding inside an app release, and rotating a secret does not roll the
  # Deployment. See .claude/memory/decisions.md.
  source:
    repoURL: https://github.com/tutac/revealroll-platform.git
    targetRevision: main
    path: secrets/staging
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: revealroll

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

  # Only the SealedSecret is in Git. The plaintext Secret it decrypts into is created
  # by the sealed-secrets controller and must never be committed — if it were, Argo
  # and the controller would each keep rewriting it and the app would flap OutOfSync.
