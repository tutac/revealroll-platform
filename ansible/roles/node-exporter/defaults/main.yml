---
node_exporter_version: "1.8.2"
node_exporter_arch: amd64          # the VPS is linux/amd64; your Mac is not
node_exporter_user: node_exporter
node_exporter_bin: /usr/local/bin/node_exporter

# Split across three vars only so no single line exceeds the 160-char yaml lint limit.
node_exporter_release: "https://github.com/prometheus/node_exporter/releases/download"
node_exporter_tarball: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
node_exporter_url: "{{ node_exporter_release }}/v{{ node_exporter_version }}/{{ node_exporter_tarball }}"

# The node's own IPv4, NOT 127.0.0.1 -- corrected in Stage 08.
#
# The original loopback bind could never have worked: a Prometheus POD's 127.0.0.1 is the
# pod's loopback, not the host's, so the scrape target was permanently down. Pods reach
# the host on its primary address, and that traffic arrives on a CNI interface, which
# roles/firewall already accepts.
#
# What keeps 9100 private is therefore the firewall's default-drop policy, not the bind
# address -- packets from the internet arrive on the public interface, where no rule
# accepts 9100. playbooks/99-verify.yml asserts exactly that, from outside.
#
# The stricter alternative is binding the flannel bridge address (10.42.0.1), which is not
# routable from the internet at all. Rejected on boot ordering: cni0 only exists once k3s
# is up, so a reboot would race node_exporter against the CNI and leave the unit failed.
node_exporter_listen_address: "{{ ansible_default_ipv4.address }}:9100"
